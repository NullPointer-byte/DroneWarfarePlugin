plugins {
    id 'java'
}

group = 'ru.dronewarfare'
version = '4.0'

repositories {
    mavenCentral()

    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }

    // Добавляем репозиторий JitPack
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }

    maven {
        url = uri("https://repo.opencollab.dev/main/")
    }
}

dependencies {
    compileOnly 'dev.folia:folia-api:1.21.11-R0.1-SNAPSHOT'

    // Vault
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'

    // FlorestRollback через JitPack
    compileOnly 'com.github.FlorestMCServer:FlorestRollback:1.2'

    // GeyserMC, чтобы бедрок игрокам не закачивать RP
    compileOnly 'org.geysermc.geyser:api:2.11.2-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}