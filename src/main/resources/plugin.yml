name: MillitaryTheme
version: ${version}
main: ru.millitarytheme.MillitaryTheme
api-version: '1.21'
folia-supported: true
depend: [FlorestRollback, Vault]
softdepend: [Geyser-Spigot]
authors: [Kirill Dorohov, Kirill Borisenko]

commands:
  drone:
    description: Управление военными дронами
    usage: /drone launch
    permission: millitarytheme.drone
  gun:
    description: Покупка оружия
    usage: /gun <gun type>
    permission: millitarytheme.gun

permissions:
  millitarytheme.drone:
    description: Использование дронов
    default: true
  millitarytheme.gun:
    description: Покупка орудий
    default: true